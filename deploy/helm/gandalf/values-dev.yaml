# Default values for gandalf.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  gandalf:
    tag: 2.3.0

app:
  otel:
    enabled: true
  public_url: https://gandalf.renci.org
  bl_version: 4.2.6-rc5
  gandalf:
    num_workers: 2
    slack_webhook_url:
    service:
      port: 6429
      type: ClusterIP
    resources:
      requests:
        cpu: "2000m"
        memory: "3Gi"
      limits:
        cpu: "2000m"
        memory: "5Gi"
    sharedData:
      mountPath: /data
    autoscaling:
      enabled: false
      replicaCount: 1
    loader:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      image:
        repository: busybox
        tag: "1.36"
        pullPolicy: IfNotPresent
      sources:
        - "https://stars.renci.org/var/translator/gandalf/gandalf_v1.2.0_translatorkg_v1.0.2.tar.gz"

      # Skip download if data already exists and source URLs haven't changed
      skipIfExists: true

      # Optional shell command to run after all downloads complete
      # Runs inside the init container with the data volume mounted
      postDownloadCommand: "ls -lh /data/gandalf_mmap"

      # Resources for the init container (downloads can be memory-light)
      resources:
        requests:
          cpu: "1000m"
          memory: "5Gi"
          ephemeral-storage: "10Gi"
        limits:
          cpu: "2"
          memory: "6Gi"
          ephemeral-storage: "10Gi"
    persistentVolume:
      storageClassName: basic
      accessModes:
        - ReadWriteMany
      size: "50Gi"

  openapi_config:
    # Adds more configs to default open api config
    x-translator:
      component: KP
      team:
      - 'Ranking Agent' # add teams
    contact:
      email: "max@covar.com" # email
      name: "Max Wang" # name
      x-id: "https://github.com/maximusunc" # link if available
      x-role: "contributor" # role
    termsOfService: "" # link to terms of service
    title: "Gandalf"
    description: "Biomedical Knowledge graph build by constructing relationships from federated data sets."
    tags:
     - name: translator
     - name: "trapi"
    servers:
      - description: Default server
        # this value should match chart installation name
        # https://automat-dev.renci.org/<chart install name>
        url: https://gandalf.renci.org

ingress:
  enabled: true
  tls:
    enabled: true
  gandalf:
    host: gandalf.renci.org
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
      nginx.ingress.kubernetes.io/enable-cors: "true"

x_trapi:
  maturity:
    value: "development"
  location:
    value: "RENCI"

