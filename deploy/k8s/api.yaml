# The HTTP tier.  Validates requests, puts jobs on the stream, waits for
# /query results, and serves the light endpoints (/metadata, /node_degree,
# /meta_knowledge_graph ...) from the mapped graph itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gandalf-api
  labels: {app: gandalf, tier: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gandalf, tier: api}
  template:
    metadata:
      labels: {app: gandalf, tier: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6429"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: gandalf
          image: ghcr.io/ranking-agent/gandalf:2.0.0
          ports:
            - {name: http, containerPort: 6429}
          env:
            - {name: GANDALF_GRAPH_PATH, value: /data/graph}
            - {name: GANDALF_LOG_FORMAT, value: json}
            - {name: GANDALF_QUEUE_URL, value: redis://redis:6379/0}
            # Alerts to Slack (optional).  The API's monitor sends the
            # threshold alerts, the workers their own events, so both tiers
            # need the webhook.  See "Alerts and Slack" in the README.
            - name: GANDALF_SLACK_WEBHOOK_URL
              valueFrom: {secretKeyRef: {name: gandalf-slack, key: webhook-url, optional: true}}
            - {name: GANDALF_SLACK_ENVIRONMENT, value: prod}
            - {name: GANDALF_SLACK_STATUS_URL, value: https://gandalf.example.org/status}
            # Two gunicorn workers is plenty: each request here is a
            # validate, an XADD and a wait.  Each worker can hold 40 waiting
            # /query calls (the thread pool), so this tier handles 80
            # concurrent sync clients per pod.
            - {name: GANDALF_WORKERS, value: "2"}
            # Aggregates Prometheus metrics across the gunicorn workers.
            - {name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/prometheus}
          volumeMounts:
            - {name: graph, mountPath: /data/graph, readOnly: true}
          resources:
            requests: {cpu: "500m", memory: 2Gi}
            # The API holds a compressed /query result in memory while it
            # streams it out; a few GB covers the largest.
            limits: {memory: 6Gi}
          readinessProbe:
            # 503 until the graph is open and Redis answers, so a pod that
            # cannot enqueue gets no traffic.
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # Generous: a worker process compressing a multi-gigabyte
            # response blocks its event loop for seconds and must not be
            # killed for it.
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: graph
          persistentVolumeClaim:
            claimName: gandalf-graph   # the read-only claim the loader fills
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: gandalf
  labels: {app: gandalf}
spec:
  selector: {app: gandalf, tier: api}
  ports:
    - {name: http, port: 6429, targetPort: http}
