name: Helm Chart

# Lints the chart on every change to it, and publishes it to GHCR as an OCI
# artifact: oci://ghcr.io/<owner>/charts/gandalf.

on:
  pull_request:
    branches: [main, devel]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-chart.yml"
  # Publish the chart of any branch by hand.
  workflow_dispatch:

env:
  CHART_DIR: deploy/helm/gandalf
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml"
      - name: Render with the dev values
        run: helm template gandalf "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml" > /dev/null

  publish:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Read the chart version
        id: chart
        run: |
          echo "version=$(helm show chart "$CHART_DIR" | sed -n 's/^version: //p')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm show chart "$CHART_REPOSITORY/gandalf" --version "$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::gandalf chart $VERSION is already published; nothing pushed. Bump version in Chart.yaml to release chart changes."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "$CHART_DIR" --destination dist
          helm push "dist/gandalf-$VERSION.tgz" "$CHART_REPOSITORY"
