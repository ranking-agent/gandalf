name: CI

on:
  push:
    branches: [main, devel, trapi-1.6]
  pull_request:
    branches: [main, devel, trapi-1.6]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black>=22.0
      - run: black --check gandalf/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel
          pip install -e ".[dev,server]"
      - name: Run tests
        run: python -m pytest --cov=gandalf --cov-report=term-missing -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel
          pip install -e ".[dev,server]"
          pip install mypy
      - run: mypy gandalf/ --ignore-missing-imports

  queue:
    # The Redis-backed queue and worker tests (tests/test_queue_redis.py),
    # deselected from the default run by their `integration` marker.  They
    # start their own redis-server (the outage test stops and restarts one),
    # so the runner needs the binary rather than a service container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel
          pip install -e ".[dev,server]"
      - name: Run queue tests
        run: python -m pytest -m integration tests/test_queue_redis.py -q
