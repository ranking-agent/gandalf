services:
  gandalf:
    container_name: gandalf
    build: .
    image: gandalf
    restart: unless-stopped
    ports:
      - "6429:6429"
    environment:
      GANDALF_GRAPH_PATH: /data/graph
      # Traces go to Shepherd's Jaeger (OTLP gRPC) over the shared network.
      # Set GANDALF_OTEL_ENABLED=false to run without a collector.
      GANDALF_OTEL_ENABLED: ${GANDALF_OTEL_ENABLED:-true}
      GANDALF_JAEGER_HOST: ${GANDALF_JAEGER_HOST:-http://jaeger}
      GANDALF_JAEGER_PORT: ${GANDALF_JAEGER_PORT:-4317}
      # Queue mode (`docker compose --profile queue up`): queries run in the
      # worker service below instead of in this process.  Leave empty to
      # run them in-process.
      GANDALF_QUEUE_URL: ${GANDALF_QUEUE_URL:-redis://gandalf_queue:6379/0}
    volumes:
      # Host directory holding the built graph; override with GANDALF_GRAPH_DIR.
      - ${GANDALF_GRAPH_DIR:-./translatorkg/gandalf_mmap}:/data/graph:ro
    networks:
      - shepherd

  # --- Queue mode -----------------------------------------------------------
  # docker compose --profile queue up --build
  # with GANDALF_QUEUE_URL=redis://redis:6379/0 in the environment or .env.
  # The queue must survive a Redis restart and must never be evicted:
  # every write goes to the append-only file in a host directory, and at a
  # memory limit Redis refuses writes (the API answers 503) rather than
  # dropping keys.  Gandalf logs and alerts (redis_unsafe) if either is off.
  gandalf_queue:
    image: redis:7-alpine
    profiles: [queue]
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      # Host directory for Redis's files (appendonlydir/, dump.rdb);
      # override with GANDALF_QUEUE_DATA_DIR.  Redis's image makes it owned
      # by its redis user (uid 999) on start.
      - ${GANDALF_QUEUE_DATA_DIR:-./queue_data}:/data
    networks:
      - shepherd

  worker:
    image: gandalf
    profiles: [queue]
    command: ["python", "-m", "gandalf.worker"]
    restart: unless-stopped
    depends_on: [gandalf_queue]
    environment:
      GANDALF_GRAPH_PATH: /data/graph
      GANDALF_QUEUE_URL: ${GANDALF_QUEUE_URL:-redis://gandalf_queue:6379/0}
      # The worker's spans join the API's traces (gandalf.queue_wait,
      # gandalf.job), reported as their own service.
      GANDALF_OTEL_ENABLED: ${GANDALF_OTEL_ENABLED:-true}
      GANDALF_OTEL_SERVICE_NAME: gandalf-worker
      GANDALF_JAEGER_HOST: ${GANDALF_JAEGER_HOST:-http://jaeger}
      GANDALF_JAEGER_PORT: ${GANDALF_JAEGER_PORT:-4317}
    volumes:
      - ${GANDALF_GRAPH_DIR:-./translatorkg/gandalf_mmap}:/data/graph:ro
    networks:
      - shepherd

networks:
  # Shepherd's compose network, so Gandalf can reach its `jaeger` service and
  # the retriever/Shepherd can reach Gandalf at http://gandalf:6429. Start
  # Shepherd first, or create the network with `docker network create shepherd_default`.
  shepherd:
    name: ${SHEPHERD_NETWORK:-shepherd_default}
    external: true
